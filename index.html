<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Scholar's Grimoire — Daily Quests</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet"/>

<style>
/* ═══════════════════════════════════════
   CSS VARIABLES — DARK ACADEMIA GRIMOIRE
═══════════════════════════════════════ */
:root {
  --obsidian:      #090909;
  --void:          #0d0d0f;
  --charcoal:      #111114;
  --slate:         #1a1a1f;
  --slate-light:   #22222a;
  --crimson:       #8b1a1a;
  --crimson-glow:  #c0392b;
  --blood:         #6b0f0f;
  --gold:          #c9a84c;
  --gold-light:    #e8c96a;
  --gold-dim:      #7d6530;
  --parchment:     #d4c5a9;
  --parchment-dim: #9a8e78;
  --ash:           #5a5a6e;
  --smoke:         #2e2e3a;
  --glow-red:      rgba(139,26,26,0.35);
  --glow-gold:     rgba(201,168,76,0.25);
  --font-display:  'Cinzel Decorative', serif;
  --font-heading:  'Cinzel', serif;
  --font-body:     'Crimson Pro', serif;
  --font-mono:     'JetBrains Mono', monospace;
}

/* ═══════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background-color: var(--obsidian);
  color: var(--parchment);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ═══════════════════════════════════════
   ANIMATED BACKGROUND — PARTICLE DUST
═══════════════════════════════════════ */
.bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* Vignette overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(139,26,26,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 100%, rgba(201,168,76,0.05) 0%, transparent 70%),
    radial-gradient(ellipse 100% 100% at 50% 50%, transparent 40%, rgba(0,0,0,0.7) 100%);
  z-index: 0;
  pointer-events: none;
}

/* Noise grain texture */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  background-size: 200px 200px;
  z-index: 0;
  pointer-events: none;
  opacity: 0.6;
}

/* ═══════════════════════════════════════
   LAYOUT WRAPPER
═══════════════════════════════════════ */
.grimoire {
  position: relative;
  z-index: 1;
  max-width: 820px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

/* ═══════════════════════════════════════
   HEADER — THE CREST
═══════════════════════════════════════ */
.header {
  text-align: center;
  padding: 52px 0 36px;
  position: relative;
}

.header-ornament {
  font-size: 11px;
  letter-spacing: 6px;
  color: var(--gold-dim);
  font-family: var(--font-heading);
  text-transform: uppercase;
  margin-bottom: 10px;
  opacity: 0.7;
}

.header-title {
  font-family: var(--font-display);
  font-size: clamp(22px, 5vw, 36px);
  font-weight: 900;
  color: var(--gold);
  text-shadow:
    0 0 20px var(--glow-gold),
    0 0 60px rgba(201,168,76,0.15);
  letter-spacing: 2px;
  line-height: 1.2;
  margin-bottom: 6px;
}

.header-subtitle {
  font-family: var(--font-body);
  font-style: italic;
  font-size: 15px;
  color: var(--parchment-dim);
  letter-spacing: 1px;
}

/* Ornamental divider */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 28px 0;
  color: var(--gold-dim);
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim) 50%, transparent);
}
.divider-gem {
  font-size: 12px;
  color: var(--gold);
  text-shadow: 0 0 8px var(--glow-gold);
}

/* ═══════════════════════════════════════
   STATS ROW — STREAK, XP, LEVEL
═══════════════════════════════════════ */
.stats-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 16px;
  align-items: center;
  background: linear-gradient(135deg, var(--slate) 0%, var(--slate-light) 100%);
  border: 1px solid rgba(201,168,76,0.18);
  border-radius: 12px;
  padding: 18px 24px;
  margin-bottom: 28px;
  box-shadow:
    inset 0 1px 0 rgba(201,168,76,0.08),
    0 4px 30px rgba(0,0,0,0.5),
    0 0 0 1px rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
}

.stats-row::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
}

/* Streak badge */
.streak-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 70px;
}

.streak-fire {
  font-size: 28px;
  line-height: 1;
  filter: drop-shadow(0 0 8px rgba(200,80,20,0.8));
  animation: flicker 2.5s ease-in-out infinite;
}

@keyframes flicker {
  0%, 100% { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 8px rgba(200,80,20,0.8)); }
  25%       { transform: scale(1.08) rotate(2deg); filter: drop-shadow(0 0 14px rgba(240,120,20,1)); }
  50%       { transform: scale(0.96) rotate(-1deg); filter: drop-shadow(0 0 6px rgba(200,60,10,0.7)); }
  75%       { transform: scale(1.04) rotate(3deg); filter: drop-shadow(0 0 12px rgba(220,100,15,0.9)); }
}

.streak-count {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--gold-light);
  line-height: 1;
}

.streak-label {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--ash);
  text-transform: uppercase;
  font-family: var(--font-heading);
}

/* XP bar section */
.xp-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.xp-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.xp-rank {
  font-family: var(--font-heading);
  font-size: 12px;
  color: var(--gold);
  letter-spacing: 1px;
  text-shadow: 0 0 8px var(--glow-gold);
}

.xp-numbers {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ash);
}

.xp-bar-track {
  height: 8px;
  background: rgba(0,0,0,0.5);
  border-radius: 4px;
  border: 1px solid rgba(201,168,76,0.1);
  overflow: hidden;
  position: relative;
}

.xp-bar-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--crimson) 0%, var(--gold) 100%);
  box-shadow: 0 0 8px var(--glow-gold);
  transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
  position: relative;
  min-width: 2px;
}

.xp-bar-fill::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 20px; height: 100%;
  background: rgba(255,255,255,0.25);
  filter: blur(2px);
  border-radius: 0 4px 4px 0;
}

/* Level badge */
.level-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 60px;
  background: rgba(201,168,76,0.07);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 8px;
  padding: 8px 12px;
}

.level-label {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--ash);
  text-transform: uppercase;
  font-family: var(--font-heading);
}

.level-num {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  color: var(--gold-light);
  line-height: 1;
  text-shadow: 0 0 12px var(--glow-gold);
}

/* ═══════════════════════════════════════
   DATE / DAY HEADER
═══════════════════════════════════════ */
.day-header {
  text-align: center;
  margin-bottom: 24px;
}

.day-name {
  font-family: var(--font-heading);
  font-size: 13px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--crimson-glow);
  text-shadow: 0 0 12px var(--glow-red);
  margin-bottom: 4px;
}

.date-display {
  font-family: var(--font-body);
  font-style: italic;
  font-size: 14px;
  color: var(--ash);
  letter-spacing: 1px;
}

/* ═══════════════════════════════════════
   QUEST SECTION HEADERS
═══════════════════════════════════════ */
.quest-section {
  margin-bottom: 32px;
}

.section-label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.section-label-text {
  font-family: var(--font-heading);
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gold-dim);
}

.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(201,168,76,0.25), transparent);
}

/* ═══════════════════════════════════════
   QUEST CARDS (TASK ROWS)
═══════════════════════════════════════ */
.quest-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.quest-card {
  display: grid;
  grid-template-columns: 44px 1fr auto;
  align-items: center;
  gap: 16px;
  background: linear-gradient(135deg, var(--slate) 0%, rgba(26,26,31,0.9) 100%);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 10px;
  padding: 16px 18px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition:
    border-color 0.3s ease,
    box-shadow 0.3s ease,
    transform 0.2s ease,
    background 0.3s ease;
  will-change: transform;
}

.quest-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 3px; height: 100%;
  background: linear-gradient(180deg, var(--crimson), var(--gold-dim));
  opacity: 0;
  transition: opacity 0.3s ease;
  border-radius: 10px 0 0 10px;
}

.quest-card:hover {
  border-color: rgba(201,168,76,0.25);
  box-shadow:
    0 4px 20px rgba(0,0,0,0.4),
    0 0 0 1px rgba(201,168,76,0.08),
    inset 0 1px 0 rgba(255,255,255,0.04);
  transform: translateY(-2px);
}

.quest-card:hover::before { opacity: 1; }

.quest-card:active { transform: translateY(0); }

/* Completed state */
.quest-card.completed {
  background: linear-gradient(135deg, rgba(15,20,12,0.9) 0%, rgba(10,15,10,0.9) 100%);
  border-color: rgba(201,168,76,0.15);
}

.quest-card.completed::before {
  opacity: 1;
  background: linear-gradient(180deg, var(--gold-dim), var(--gold));
}

/* ═══════════════════════════════════════
   CUSTOM CHECKBOX
═══════════════════════════════════════ */
.quest-checkbox-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
}

.quest-checkbox {
  appearance: none;
  -webkit-appearance: none;
  width: 26px;
  height: 26px;
  border: 2px solid var(--ash);
  border-radius: 6px;
  cursor: pointer;
  position: relative;
  transition:
    border-color 0.25s ease,
    background 0.25s ease,
    box-shadow 0.25s ease;
  flex-shrink: 0;
}

.quest-checkbox:hover {
  border-color: var(--gold-dim);
  box-shadow: 0 0 8px rgba(201,168,76,0.2);
}

.quest-checkbox:checked {
  background: linear-gradient(135deg, var(--crimson), var(--gold-dim));
  border-color: var(--gold);
  box-shadow:
    0 0 0 3px rgba(201,168,76,0.15),
    0 0 12px rgba(201,168,76,0.3);
}

.quest-checkbox:checked::after {
  content: '✦';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--gold-light);
  text-shadow: 0 0 6px var(--glow-gold);
  animation: checkPop 0.35s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes checkPop {
  0%   { transform: scale(0) rotate(-90deg); opacity: 0; }
  100% { transform: scale(1) rotate(0deg);   opacity: 1; }
}

/* ═══════════════════════════════════════
   QUEST TEXT
═══════════════════════════════════════ */
.quest-body {
  flex: 1;
  min-width: 0;
}

.quest-title {
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 600;
  color: var(--parchment);
  line-height: 1.4;
  transition: color 0.3s ease;
  word-break: break-word;
}

.quest-card.completed .quest-title {
  color: var(--ash);
  text-decoration: line-through;
  text-decoration-color: var(--gold-dim);
}

.quest-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}

.quest-time-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--crimson-glow);
  background: rgba(139,26,26,0.15);
  border: 1px solid rgba(139,26,26,0.25);
  border-radius: 4px;
  padding: 1px 6px;
  letter-spacing: 0.5px;
}

.quest-duration {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ash);
  letter-spacing: 0.5px;
}

/* XP chip */
.quest-xp {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gold-dim);
  background: rgba(201,168,76,0.06);
  border: 1px solid rgba(201,168,76,0.15);
  border-radius: 20px;
  padding: 4px 10px;
  white-space: nowrap;
  transition: color 0.3s ease, background 0.3s ease;
  flex-shrink: 0;
}

.quest-card.completed .quest-xp {
  color: var(--gold);
  background: rgba(201,168,76,0.12);
  border-color: rgba(201,168,76,0.3);
}

/* ═══════════════════════════════════════
   PROGRESS SUMMARY
═══════════════════════════════════════ */
.progress-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
  padding: 12px 18px;
  background: rgba(0,0,0,0.3);
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.04);
}

.progress-text {
  font-family: var(--font-heading);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--ash);
}

.progress-fraction {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gold-dim);
}

.mini-track {
  flex: 1;
  height: 4px;
  background: rgba(0,0,0,0.4);
  border-radius: 2px;
  overflow: hidden;
}

.mini-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blood), var(--gold));
  border-radius: 2px;
  transition: width 0.5s ease;
  box-shadow: 0 0 6px var(--glow-gold);
}

/* ═══════════════════════════════════════
   XP FLOAT ANIMATION
═══════════════════════════════════════ */
.xp-float {
  position: fixed;
  font-family: var(--font-heading);
  font-size: 13px;
  font-weight: 700;
  color: var(--gold-light);
  text-shadow: 0 0 10px var(--glow-gold);
  pointer-events: none;
  z-index: 9999;
  animation: xpFloat 1.4s ease-out forwards;
  letter-spacing: 1px;
}

@keyframes xpFloat {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  30%  { opacity: 1; transform: translateY(-20px) scale(1.2); }
  100% { opacity: 0; transform: translateY(-70px) scale(0.9); }
}

/* ═══════════════════════════════════════
   LEVEL UP FLASH
═══════════════════════════════════════ */
.levelup-overlay {
  position: fixed;
  inset: 0;
  z-index: 9998;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
  opacity: 0;
}

.levelup-overlay.active {
  animation: levelupShow 2.5s ease-out forwards;
}

.levelup-bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(201,168,76,0.18) 0%, transparent 70%);
}

.levelup-title {
  font-family: var(--font-display);
  font-size: clamp(28px, 6vw, 48px);
  font-weight: 900;
  color: var(--gold-light);
  text-shadow:
    0 0 20px var(--glow-gold),
    0 0 60px rgba(201,168,76,0.4);
  text-align: center;
  letter-spacing: 3px;
  position: relative;
}

.levelup-sub {
  font-family: var(--font-heading);
  font-size: 14px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gold-dim);
  position: relative;
}

@keyframes levelupShow {
  0%   { opacity: 0; }
  10%  { opacity: 1; }
  70%  { opacity: 1; }
  100% { opacity: 0; }
}

/* ═══════════════════════════════════════
   DAY CONQUERED OVERLAY
═══════════════════════════════════════ */
.conquered-overlay {
  position: fixed;
  inset: 0;
  z-index: 9997;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  pointer-events: none;
  opacity: 0;
}

.conquered-overlay.active {
  animation: conqueredAnim 3.5s ease-out forwards;
}

.conquered-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 80% at 50% 50%, rgba(139,26,26,0.25) 0%, transparent 70%);
  box-shadow: inset 0 0 120px rgba(139,26,26,0.15);
}

.conquered-text {
  font-family: var(--font-display);
  font-size: clamp(32px, 7vw, 56px);
  font-weight: 900;
  color: var(--crimson-glow);
  text-shadow:
    0 0 20px rgba(192,57,43,0.7),
    0 0 60px rgba(192,57,43,0.3);
  letter-spacing: 4px;
  text-align: center;
  position: relative;
}

.conquered-runes {
  font-family: var(--font-body);
  font-style: italic;
  font-size: 16px;
  color: var(--gold-dim);
  letter-spacing: 3px;
  position: relative;
  text-align: center;
}

.conquered-border {
  position: absolute;
  inset: 0;
  border: 1px solid rgba(192,57,43,0.3);
  animation: borderPulse 1s ease-in-out infinite;
  pointer-events: none;
}

@keyframes borderPulse {
  0%, 100% { opacity: 0.3; box-shadow: inset 0 0 40px rgba(139,26,26,0.2); }
  50%       { opacity: 0.7; box-shadow: inset 0 0 80px rgba(139,26,26,0.4); }
}

@keyframes conqueredAnim {
  0%   { opacity: 0; }
  8%   { opacity: 1; }
  75%  { opacity: 1; }
  100% { opacity: 0; }
}

/* ═══════════════════════════════════════
   FOOTER
═══════════════════════════════════════ */
.footer {
  text-align: center;
  padding-top: 32px;
  font-size: 11px;
  color: var(--ash);
  letter-spacing: 2px;
  font-family: var(--font-heading);
  text-transform: uppercase;
  opacity: 0.5;
}

/* ═══════════════════════════════════════
   CANVAS PARTICLES
═══════════════════════════════════════ */
canvas.bg-canvas { opacity: 0.55; }

/* ═══════════════════════════════════════
   SCROLL & MISC
═══════════════════════════════════════ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--void); }
::-webkit-scrollbar-thumb { background: var(--smoke); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--ash); }

/* ═══════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════ */
@media (max-width: 520px) {
  .stats-row { grid-template-columns: auto 1fr; }
  .level-badge { display: none; }
  .quest-card { grid-template-columns: 38px 1fr; }
  .quest-xp { display: none; }
  .header-title { font-size: 22px; }
}

/* ═══════════════════════════════════════
   ENTRANCE ANIMATIONS
═══════════════════════════════════════ */
.grimoire { animation: fadeIn 0.8s ease-out; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.quest-card {
  animation: slideIn 0.4s ease-out backwards;
}

.quest-card:nth-child(1)  { animation-delay: 0.05s; }
.quest-card:nth-child(2)  { animation-delay: 0.10s; }
.quest-card:nth-child(3)  { animation-delay: 0.15s; }
.quest-card:nth-child(4)  { animation-delay: 0.20s; }
.quest-card:nth-child(5)  { animation-delay: 0.25s; }

@keyframes slideIn {
  from { opacity: 0; transform: translateX(-16px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* Reset button */
.reset-btn {
  display: block;
  margin: 0 auto;
  background: transparent;
  border: 1px solid rgba(139,26,26,0.3);
  color: var(--ash);
  font-family: var(--font-heading);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 8px 18px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.25s ease;
  margin-bottom: 16px;
}
.reset-btn:hover {
  border-color: var(--crimson);
  color: var(--crimson-glow);
  box-shadow: 0 0 10px var(--glow-red);
}

/* Empty day message */
.empty-day {
  text-align: center;
  padding: 48px 24px;
  color: var(--ash);
}
.empty-day-icon { font-size: 36px; margin-bottom: 12px; }
.empty-day-text {
  font-family: var(--font-body);
  font-style: italic;
  font-size: 16px;
  color: var(--ash);
}

</style>
</head>
<body>

<!-- Particle canvas -->
<canvas class="bg-canvas" id="bgCanvas"></canvas>

<!-- Day Conquered Overlay -->
<div class="conquered-overlay" id="conqueredOverlay">
  <div class="conquered-border"></div>
  <div class="conquered-bg"></div>
  <div class="conquered-text">DAY CONQUERED</div>
  <div class="conquered-runes">All quests fulfilled. The darkness yields.</div>
</div>

<!-- Level Up Overlay -->
<div class="levelup-overlay" id="levelupOverlay">
  <div class="levelup-bg"></div>
  <div class="levelup-title" id="levelupTitle">LEVEL UP!</div>
  <div class="levelup-sub" id="levelupSub">You have ascended</div>
</div>

<!-- Main Content -->
<div class="grimoire">

  <!-- Header -->
  <header class="header">
    <div class="header-ornament">◆ Scholar's Codex ◆</div>
    <h1 class="header-title">The Daily Grimoire</h1>
    <p class="header-subtitle">دفتر المهام اليومية — إتقن فنك أو تُهزم</p>
  </header>

  <!-- Stats Row -->
  <div class="stats-row">
    <!-- Streak -->
    <div class="streak-badge">
      <div class="streak-fire">🔥</div>
      <div class="streak-count" id="streakCount">0</div>
      <div class="streak-label">Streak</div>
    </div>

    <!-- XP Bar -->
    <div class="xp-section">
      <div class="xp-meta">
        <span class="xp-rank" id="rankTitle">Novice</span>
        <span class="xp-numbers"><span id="currentXP">0</span> / <span id="nextXP">500</span> XP</span>
      </div>
      <div class="xp-bar-track">
        <div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div>
      </div>
    </div>

    <!-- Level -->
    <div class="level-badge">
      <div class="level-label">Level</div>
      <div class="level-num" id="levelNum">1</div>
    </div>
  </div>

  <!-- Day Header -->
  <div class="day-header">
    <div class="day-name" id="dayName">—</div>
    <div class="date-display" id="dateDisplay">—</div>
  </div>

  <div class="divider"><span class="divider-gem">✦</span></div>

  <!-- Progress Summary -->
  <div class="progress-summary">
    <span class="progress-text">Daily Progress</span>
    <div class="mini-track">
      <div class="mini-fill" id="miniProgressFill" style="width:0%"></div>
    </div>
    <span class="progress-fraction" id="progressFraction">0/0</span>
  </div>

  <!-- Quest Lists injected here -->
  <div id="questsContainer"></div>

  <button class="reset-btn" id="resetBtn" title="Reset all progress (for testing)">⚠ Reset Data</button>

  <footer class="footer">Forged in the darkness — Rise through discipline</footer>
</div>

<script>
/* ══════════════════════════════════════════
   DATA — SCHEDULE
══════════════════════════════════════════ */
const SCHEDULE = {
  daily_tasks: [
    { time: "الصباح",  task: "دراسة اللغة الإيطالية (Nuovo Espresso)", duration: "1 Hour" },
    { time: "الليل",   task: "التدريب على اللكنة الإنجليزية",           duration: "30 Mins" }
  ],
  days: {
    Saturday:  [
      { time: "المساء", task: "كورس CS50 (محاضرات أو مشاريع)",           duration: "2 Hours" },
      { time: "الليل",  task: "Python Data Science Handbook (تطبيق عملي)", duration: "45 Mins" }
    ],
    Monday:    [
      { time: "المساء", task: "كورس CS50 (محاضرات أو مشاريع)",           duration: "2 Hours" },
      { time: "الليل",  task: "Python Data Science Handbook (تطبيق عملي)", duration: "45 Mins" }
    ],
    Wednesday: [
      { time: "المساء", task: "كورس CS50 (محاضرات أو مشاريع)",           duration: "2 Hours" },
      { time: "الليل",  task: "Python Data Science Handbook (تطبيق عملي)", duration: "45 Mins" }
    ],
    Sunday:    [
      { time: "المساء", task: "Python Data Science Handbook (دراسة وتطبيق موسع)", duration: "2 Hours" }
    ],
    Tuesday:   [
      { time: "المساء", task: "Python Data Science Handbook (دراسة وتطبيق موسع)", duration: "2 Hours" }
    ],
    Thursday:  [
      { time: "المساء", task: "Python Data Science Handbook (دراسة وتطبيق موسع)", duration: "2 Hours" }
    ],
    Friday:    [
      { time: "المساء",           task: "تطبيق خفيف علوم بيانات + راحة أو ألعاب",           duration: "1 Hour" },
      { time: "إضافات الشهر الأخير", task: "Microsoft Office + فيديوهات 3D للدوائر والبوابات المنطقية", duration: "1 Hour" }
    ]
  }
};

const RANKS = [
  { level: 1,  title: "Novice",              color: "#9a8e78" },
  { level: 3,  title: "Apprentice Scholar",  color: "#c9a84c" },
  { level: 5,  title: "Code Apprentice",     color: "#c9a84c" },
  { level: 8,  title: "Dark Adept",          color: "#e8c96a" },
  { level: 10, title: "Data Knight",         color: "#e8c96a" },
  { level: 13, title: "Algorithm Sage",      color: "#c0392b" },
  { level: 16, title: "Shadow Architect",    color: "#c0392b" },
  { level: 20, title: "Master Engineer",     color: "#ffd700" },
  { level: 25, title: "Grand Wizard",        color: "#ffd700" },
  { level: 30, title: "Eternal Scholar",     color: "#fff8e7" },
];

const XP_PER_TASK   = 50;
const XP_PER_LEVEL  = 500;

/* ══════════════════════════════════════════
   STATE HELPERS
══════════════════════════════════════════ */
function loadState() {
  return {
    streak:       parseInt(localStorage.getItem('gs_streak')    || '0'),
    totalXP:      parseInt(localStorage.getItem('gs_xp')        || '0'),
    level:        parseInt(localStorage.getItem('gs_level')     || '1'),
    lastDate:     localStorage.getItem('gs_lastDate')           || '',
    checksMap:    JSON.parse(localStorage.getItem('gs_checks')  || '{}'),
  };
}

function saveState(s) {
  localStorage.setItem('gs_streak',   s.streak);
  localStorage.setItem('gs_xp',       s.totalXP);
  localStorage.setItem('gs_level',    s.level);
  localStorage.setItem('gs_lastDate', s.lastDate);
  localStorage.setItem('gs_checks',   JSON.stringify(s.checksMap));
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function getRankInfo(level) {
  let rank = RANKS[0];
  for (const r of RANKS) { if (level >= r.level) rank = r; }
  return rank;
}

/* ══════════════════════════════════════════
   PARTICLE BACKGROUND
══════════════════════════════════════════ */
(function initParticles() {
  const canvas = document.getElementById('bgCanvas');
  const ctx    = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function Particle() {
    this.reset();
  }
  Particle.prototype.reset = function() {
    this.x    = Math.random() * W;
    this.y    = Math.random() * H;
    this.r    = Math.random() * 1.2 + 0.3;
    this.vx   = (Math.random() - 0.5) * 0.12;
    this.vy   = -(Math.random() * 0.25 + 0.05);
    this.life = 0;
    this.maxLife = Math.random() * 300 + 150;
    const types = ['gold', 'crimson', 'smoke'];
    this.type = types[Math.floor(Math.random() * types.length)];
  };
  Particle.prototype.color = function(alpha) {
    if (this.type === 'gold')    return `rgba(201,168,76,${alpha})`;
    if (this.type === 'crimson') return `rgba(139,26,26,${alpha})`;
    return `rgba(90,90,110,${alpha})`;
  };
  Particle.prototype.update = function() {
    this.x += this.vx;
    this.y += this.vy;
    this.life++;
    if (this.life > this.maxLife || this.y < -10) this.reset();
  };
  Particle.prototype.draw = function() {
    const progress = this.life / this.maxLife;
    const alpha    = Math.sin(progress * Math.PI) * 0.6;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color(alpha);
    ctx.fill();
  };

  function initParticleSet() {
    particles = [];
    for (let i = 0; i < 80; i++) {
      const p = new Particle();
      p.life = Math.random() * p.maxLife;
      particles.push(p);
    }
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', () => { resize(); initParticleSet(); });
  resize();
  initParticleSet();
  loop();
})();

/* ══════════════════════════════════════════
   STREAK LOGIC
══════════════════════════════════════════ */
function checkAndUpdateStreak(state, todayStr) {
  if (state.lastDate === '') {
    // First ever load — just set lastDate, no streak change
    state.lastDate = todayStr;
    return state;
  }

  if (state.lastDate === todayStr) {
    // Same day, nothing to evaluate yet
    return state;
  }

  // A new day has started — evaluate YESTERDAY
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yKey = `${yesterday.getFullYear()}-${yesterday.getMonth()+1}-${yesterday.getDate()}`;

  if (state.lastDate === yKey) {
    // We had activity recorded yesterday; check if any tasks were checked
    const anyDone = Object.values(state.checksMap).some(v => v === true);
    // Note: checksMap holds today's tasks only (we clear per-day)
    // At this point the new day started but checksMap still has yesterday's data
    // If yesterday's checks exist and any are true — streak continues, else reset
    // We rely on the fact that on the new day start we haven't cleared checksMap yet
    const yesterdayChecks = Object.entries(state.checksMap)
      .filter(([k]) => k.startsWith(yKey + '_'));
    const hadAnyYesterday = yesterdayChecks.some(([,v]) => v === true);
    if (!hadAnyYesterday) {
      state.streak = 0;
    }
    // If hadAnyYesterday — streak stays as is (don't increment here, increment is per task)
  } else {
    // Missed more than one day
    const checksForLastDate = Object.entries(state.checksMap)
      .filter(([k]) => k.startsWith(state.lastDate + '_'));
    const hadAny = checksForLastDate.some(([,v]) => v === true);
    if (!hadAny) {
      state.streak = 0;
    }
  }

  state.lastDate = todayStr;
  return state;
}

/* ══════════════════════════════════════════
   UI UPDATES
══════════════════════════════════════════ */
function updateStatsUI(state) {
  const level    = state.level;
  const levelXP  = (level - 1) * XP_PER_LEVEL;
  const nextXP   = level * XP_PER_LEVEL;
  const currXP   = state.totalXP - levelXP;
  const pct      = Math.min((currXP / XP_PER_LEVEL) * 100, 100);
  const rank     = getRankInfo(level);

  document.getElementById('streakCount').textContent  = state.streak;
  document.getElementById('levelNum').textContent     = level;
  document.getElementById('currentXP').textContent    = currXP;
  document.getElementById('nextXP').textContent       = XP_PER_LEVEL;
  document.getElementById('xpBarFill').style.width    = pct + '%';
  const rankEl = document.getElementById('rankTitle');
  rankEl.textContent  = `Lvl ${level}: ${rank.title}`;
  rankEl.style.color  = rank.color;
}

function updateProgressUI(total, done) {
  const pct = total === 0 ? 0 : (done / total) * 100;
  document.getElementById('miniProgressFill').style.width = pct + '%';
  document.getElementById('progressFraction').textContent = `${done}/${total}`;
}

/* ══════════════════════════════════════════
   XP FLOAT EFFECT
══════════════════════════════════════════ */
function showXpFloat(el) {
  const rect   = el.getBoundingClientRect();
  const floater = document.createElement('div');
  floater.className   = 'xp-float';
  floater.textContent = '+50 XP';
  floater.style.left  = (rect.left + rect.width / 2 - 24) + 'px';
  floater.style.top   = (rect.top - 10 + window.scrollY) + 'px';
  document.body.appendChild(floater);
  setTimeout(() => floater.remove(), 1500);
}

/* ══════════════════════════════════════════
   LEVEL UP OVERLAY
══════════════════════════════════════════ */
function showLevelUp(level) {
  const rank = getRankInfo(level);
  document.getElementById('levelupTitle').textContent = `LEVEL ${level}`;
  document.getElementById('levelupSub').textContent   = rank.title;
  const overlay = document.getElementById('levelupOverlay');
  overlay.classList.remove('active');
  void overlay.offsetWidth;
  overlay.classList.add('active');
  setTimeout(() => overlay.classList.remove('active'), 2600);
}

/* ══════════════════════════════════════════
   DAY CONQUERED OVERLAY
══════════════════════════════════════════ */
function showConquered() {
  const overlay = document.getElementById('conqueredOverlay');
  overlay.classList.remove('active');
  void overlay.offsetWidth;
  overlay.classList.add('active');
  setTimeout(() => overlay.classList.remove('active'), 3600);
}

/* ══════════════════════════════════════════
   BUILD TASK LIST
══════════════════════════════════════════ */
function buildTaskList() {
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const now      = new Date();
  const dayName  = dayNames[now.getDay()];
  const today    = todayKey();

  // Day header
  const arabicDays = {
    Sunday:'الأحد', Monday:'الاثنين', Tuesday:'الثلاثاء',
    Wednesday:'الأربعاء', Thursday:'الخميس', Friday:'الجمعة', Saturday:'السبت'
  };
  document.getElementById('dayName').textContent    = arabicDays[dayName] || dayName;
  document.getElementById('dateDisplay').textContent =
    now.toLocaleDateString('ar-IQ', { year:'numeric', month:'long', day:'numeric' });

  // Merge daily + day-specific
  const dayTasks     = SCHEDULE.days[dayName] || [];
  const allTasks     = [...SCHEDULE.daily_tasks, ...dayTasks];

  let state = loadState();
  state = checkAndUpdateStreak(state, today);
  saveState(state);
  updateStatsUI(state);

  const container = document.getElementById('questsContainer');
  container.innerHTML = '';

  if (allTasks.length === 0) {
    container.innerHTML = `
      <div class="empty-day">
        <div class="empty-day-icon">⚗️</div>
        <div class="empty-day-text">لا مهام مجدولة اليوم — استرح يا فارس</div>
      </div>`;
    updateProgressUI(0, 0);
    return;
  }

  // Group by section: daily tasks, then day tasks
  const sections = [
    { label: 'المهام اليومية — Daily Quests', tasks: SCHEDULE.daily_tasks },
    { label: 'مهام اليوم الخاص — ' + dayName + ' Quests', tasks: dayTasks }
  ].filter(s => s.tasks.length > 0);

  let totalCount = 0, doneCount = 0;

  sections.forEach(sec => {
    const section  = document.createElement('div');
    section.className = 'quest-section';

    const labelEl = document.createElement('div');
    labelEl.className = 'section-label';
    labelEl.innerHTML = `<span class="section-label-text">${sec.label}</span>`;
    section.appendChild(labelEl);

    const list = document.createElement('div');
    list.className = 'quest-list';

    sec.tasks.forEach((task, idx) => {
      const taskKey = `${today}_${sec.label}_${idx}`;
      const checked  = state.checksMap[taskKey] === true;
      totalCount++;
      if (checked) doneCount++;

      const card = document.createElement('div');
      card.className = 'quest-card' + (checked ? ' completed' : '');

      card.innerHTML = `
        <div class="quest-checkbox-wrap">
          <input type="checkbox" class="quest-checkbox" id="${taskKey}" ${checked ? 'checked' : ''}/>
        </div>
        <div class="quest-body">
          <div class="quest-title">${task.task}</div>
          <div class="quest-meta">
            <span class="quest-time-tag">${task.time}</span>
            <span class="quest-duration">⏱ ${task.duration}</span>
          </div>
        </div>
        <div class="quest-xp">${checked ? '✦ +50 XP' : '+50 XP'}</div>
      `;

      const checkbox = card.querySelector('.quest-checkbox');

      checkbox.addEventListener('change', function(e) {
        e.stopPropagation();
        handleCheck(taskKey, this.checked, card, allTasks, today);
      });

      card.addEventListener('click', function(e) {
        if (e.target === checkbox) return;
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event('change'));
      });

      list.appendChild(card);
    });

    section.appendChild(list);
    container.appendChild(section);
  });

  updateProgressUI(totalCount, doneCount);
  updateStatsUI(state);
}

/* ══════════════════════════════════════════
   HANDLE CHECKBOX TOGGLE
══════════════════════════════════════════ */
function handleCheck(taskKey, isChecked, card, allTasks, today) {
  let state = loadState();
  const wasChecked = state.checksMap[taskKey] === true;

  if (isChecked === wasChecked) return; // no change

  state.checksMap[taskKey] = isChecked;

  if (isChecked) {
    // Award XP
    const prevLevel = state.level;
    state.totalXP  += XP_PER_TASK;
    state.level     = Math.floor(state.totalXP / XP_PER_LEVEL) + 1;

    // Streak: increment on first task of today
    const todayTasks = Object.entries(state.checksMap)
      .filter(([k]) => k.startsWith(today + '_'));
    const totalCheckedToday = todayTasks.filter(([,v]) => v === true).length;
    if (totalCheckedToday === 1) {
      // First task of the day — increment streak
      state.streak++;
      state.lastDate = today;
    }

    card.classList.add('completed');
    card.querySelector('.quest-xp').textContent = '✦ +50 XP';

    // XP float
    showXpFloat(card);

    // Level up?
    if (state.level > prevLevel) {
      showLevelUp(state.level);
    }

    // Check if ALL tasks done today
    const allKeys     = getAllTaskKeys(today);
    const allChecked  = allKeys.every(k => state.checksMap[k] === true);
    if (allChecked && allKeys.length > 0) {
      setTimeout(showConquered, 400);
    }

  } else {
    // Unchecking — remove XP
    state.totalXP  = Math.max(0, state.totalXP - XP_PER_TASK);
    state.level     = Math.floor(state.totalXP / XP_PER_LEVEL) + 1;

    // Recalculate streak: if no tasks left for today, decrement streak
    const todayTasks = Object.entries(state.checksMap)
      .filter(([k]) => k.startsWith(today + '_'));
    const totalCheckedToday = todayTasks.filter(([,v]) => v === true).length;
    if (totalCheckedToday === 0 && state.streak > 0) {
      state.streak--;
    }

    card.classList.remove('completed');
    card.querySelector('.quest-xp').textContent = '+50 XP';
  }

  saveState(state);
  updateStatsUI(state);

  // Update progress
  const today2     = todayKey();
  const allKeys    = getAllTaskKeys(today2);
  const doneCount  = allKeys.filter(k => state.checksMap[k] === true).length;
  updateProgressUI(allKeys.length, doneCount);
}

/* ══════════════════════════════════════════
   HELPER — GET ALL TASK KEYS FOR A DAY
══════════════════════════════════════════ */
function getAllTaskKeys(todayStr) {
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const now      = new Date();
  const dayName  = dayNames[now.getDay()];
  const dayTasks = SCHEDULE.days[dayName] || [];
  const sections = [
    { label: 'المهام اليومية — Daily Quests', tasks: SCHEDULE.daily_tasks },
    { label: 'مهام اليوم الخاص — ' + dayName + ' Quests', tasks: dayTasks }
  ].filter(s => s.tasks.length > 0);

  const keys = [];
  sections.forEach(sec => {
    sec.tasks.forEach((_, idx) => {
      keys.push(`${todayStr}_${sec.label}_${idx}`);
    });
  });
  return keys;
}

/* ══════════════════════════════════════════
   RESET BUTTON
══════════════════════════════════════════ */
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('إعادة تعيين كل البيانات؟ (Reset all data?)')) {
    localStorage.clear();
    location.reload();
  }
});

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
buildTaskList();

// Check for new day every minute
setInterval(() => {
  const stored = localStorage.getItem('gs_lastDate') || '';
  if (stored !== todayKey()) buildTaskList();
}, 60000);
</script>
